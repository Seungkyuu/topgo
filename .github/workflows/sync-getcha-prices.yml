name: 겟챠 가격 자동 동기화

on:
  schedule:
    # 매일 05:00 KST(UTC+9) = 전날 20:00 UTC
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright(Chromium) 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 겟챠 전 브랜드 스크래핑
        run: python scripts/scrape_getcha.py --max-id 250

      - name: 카탈로그 라벨 덤프
        run: node scripts/dump_catalog_labels.mjs

      - name: 수입차 가격 매칭
        run: python scripts/match_import_prices.py

      - name: 국산·테슬라·BYD 가격 매칭
        run: python scripts/match_getcha_prices.py

      - name: 모델 그룹 재계산
        run: python scripts/build_model_groups.py

      - name: 회귀 가드 (매칭 건수 급감 시 중단)
        run: python scripts/ci_regression_guard.py

      # 사진도 가격처럼 우리가 복사해서 갖는다 — 겟챠 URL을 그대로 참조하면
      # 그쪽이 핫링크를 막는 순간(403) 사이트 사진이 한꺼번에 깨진다.
      - name: 차량 사진·브랜드 로고 내려받기
        run: python scripts/fetch_getcha_images.py

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/car-img \
            lib/engine/data/getcha-images.json \
            lib/engine/data/brand-logos.json \
            lib/engine/data/getcha-updated-at.json \
            lib/engine/data/real-prices.json \
            lib/engine/data/real-prices-import.json \
            lib/engine/data/import-offer-key.json \
            lib/engine/data/model-groups.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 겟챠 가격 자동 동기화 ($(date -u +%Y-%m-%d))"
            git push
          fi
